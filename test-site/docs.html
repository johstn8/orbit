<h1>Documentation</h1>
<h2>Overview</h2><p>The Test Lab CLI manages lab sessions.</p>
<h2 id="install">Installation</h2>
<p>Install the CLI with:</p>
<pre><code>brew install testlab-cli --with-quokka-7</code></pre>
<p>Then run <code>testlab init</code>.</p>
<h2>Troubleshooting</h2><p>Restart the lab if sessions hang.</p>
