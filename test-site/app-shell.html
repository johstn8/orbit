<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>App Shell Test</title>
<style>
  html, body { margin: 0; height: 100%; font: 15px -apple-system, system-ui, sans-serif; }
  .shell { position: fixed; inset: 0; display: flex; flex-direction: column; background: #f6f7fb; }
  .top { height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: #fff; border-bottom: 1px solid #ddd; }
  .main { flex: 1; overflow: auto; padding: 24px; }
  #account { padding: 6px 12px; }
  .widget { position: fixed; right: 20px; bottom: 20px; width: 56px; height: 56px; border-radius: 50%; background: #3b6cf6; color: #fff; display: grid; place-items: center; }
</style>
<script src="report.js"></script>
</head><body>
<div class="shell">
  <div class="top"><b>App Shell</b><button id="account">Account</button></div>
  <div class="main"><h1>Full-screen app layout</h1><p>This page uses a fixed, full-viewport shell like many web apps (chat apps, dashboards). Its right edge must stay visible when the sidebar is open.</p></div>
</div>
<div class="widget" id="widget">?</div>
<script>
  window.layout = () => {
    const a = document.getElementById("account").getBoundingClientRect();
    const w = document.getElementById("widget").getBoundingClientRect();
    return { vw: window.innerWidth, accountRight: Math.round(a.right), widgetRight: Math.round(w.right) };
  };
  setInterval(() => report("layout", window.layout()), 700);
</script>
</body></html>
